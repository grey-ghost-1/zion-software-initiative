[project]
name = "zion-api"
version = "0.1.0"
description = "Foundation-stage API for the Zion Software Initiative."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
    "bcrypt==5.0.0",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.5",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's
# idiomatic dependency-injection pattern, not the mutable-default footgun
# bugbear normally warns about.
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
