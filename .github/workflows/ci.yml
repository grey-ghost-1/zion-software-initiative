name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint web
        run: npm run lint:web
      - name: Type-check web
        run: npm run typecheck:web
      - name: Test web
        run: npm run test:web
      - name: Build web
        run: npm run build

  api:
    name: API lint, type-check, test, compile, and health contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install pinned dependencies
        run: python -m pip install --requirement apps/api/requirements-dev.lock
      - name: Lint Python
        run: python -m ruff check apps/api tests
      - name: Type-check Python
        run: python -m mypy apps/api/zion_api apps/api/tests tests
      - name: Test API and repository contracts
        run: python -m pytest apps/api/tests tests
      - name: Compile Python
        run: python -m compileall -q apps/api/zion_api apps/api/tests tests
