name: Bug report
description: Report reproducible behavior in the repository foundation
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities or include sensitive data here.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal, non-sensitive steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Node.js, npm, and Python versions as relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no secrets, personal data, or vulnerability details.
          required: true
