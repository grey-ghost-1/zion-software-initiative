name: Change proposal
description: Propose a scoped improvement without claiming unavailable capability
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What evidence-backed need would this change address?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Explain what is included and explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and data
      description: List supporting sources and confirm that no sensitive data is needed.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This proposal does not claim real users, partnerships, clinical capability, field impact, or production readiness.
          required: true
